<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบจัดการคลังสินค้า</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }
    header {
      background: #0d6efd;
      color: white;
      padding: 20px;
      text-align: center;
    }
    main {
      padding: 20px;
    }
    .card {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    footer {
      text-align: center;
      padding: 10px;
      color: #666;
    }
  </style>
</head>
<body>

<header>
  <h1>ระบบจัดการคลังสินค้า</h1>
  <p>เว็บโปรเจกต์นักศึกษา</p>
</header>

<main>
  <div class="card">
    <h3>📦 รับสินค้า</h3>
    <p>บันทึกรายการรับสินค้าเข้าคลัง</p>
  </div>

  <div class="card">
    <h3>📤 เบิกสินค้า</h3>
    <p>บันทึกรายการเบิกสินค้าออกจากคลัง</p>
  </div>

  <div class="card">
    <h3>📊 ติดตามจำนวน</h3>
    <p>ตรวจสอบจำนวนสินค้าแบบเรียลไทม์</p>
  </div>

  <div class="card">
    <h3>⚠️ เตือนสินค้าใกล้หมด</h3>
    <p>แจ้งเตือนเมื่อสินค้าต่ำกว่าที่กำหนด</p>
  </div>
</main>

<footer>
  จัดทำโดย: นนท์
</footer>

</body>
</html>
